<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#004f9f" />
  <g fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Train front body -->
    <rect x="136" y="110" width="240" height="260" rx="36" fill="#004f9f" />
    <!-- Train windshield -->
    <rect x="166" y="146" width="180" height="84" rx="16" fill="#ffffff" stroke="none" />
    <!-- Lights -->
    <circle cx="180" cy="300" r="16" fill="#ffd100" stroke="none" />
    <circle cx="332" cy="300" r="16" fill="#ffd100" stroke="none" />
    <circle cx="256" cy="260" r="12" fill="#ffffff" stroke="none" />
    <!-- Tracks -->
    <line x1="100" y1="420" x2="412" y2="420" />
    <line x1="160" y1="420" x2="140" y2="460" />
    <line x1="352" y1="420" x2="372" y2="460" />
  </g>
</svg>
